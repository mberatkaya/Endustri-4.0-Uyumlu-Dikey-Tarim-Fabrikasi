name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Black formatting
        run: |
          black --check \
            tests \
            iot-bulut-mimarisi/simulator/sensor_core.py \
            iot-bulut-mimarisi/simulator/sensor_simulator.py \
            iot-bulut-mimarisi/subscriber/message_processor.py \
            iot-bulut-mimarisi/subscriber/sensor_store.py \
            iot-bulut-mimarisi/subscriber/mqtt_subscriber.py \
            XGBoost-Hasat-Tahmin-Modeli/harvest_model.py \
            projeuyp/services.py \
            "Görüntü İşleme/src/demo_predict.py"
      - name: Check import ordering
        run: |
          isort --check-only \
            tests \
            iot-bulut-mimarisi/simulator/sensor_core.py \
            iot-bulut-mimarisi/simulator/sensor_simulator.py \
            iot-bulut-mimarisi/subscriber/message_processor.py \
            iot-bulut-mimarisi/subscriber/sensor_store.py \
            iot-bulut-mimarisi/subscriber/mqtt_subscriber.py \
            XGBoost-Hasat-Tahmin-Modeli/harvest_model.py \
            projeuyp/services.py \
            "Görüntü İşleme/src/demo_predict.py"
      - name: Run flake8
        run: |
          flake8 \
            tests \
            iot-bulut-mimarisi/simulator/sensor_core.py \
            iot-bulut-mimarisi/simulator/sensor_simulator.py \
            iot-bulut-mimarisi/subscriber/message_processor.py \
            iot-bulut-mimarisi/subscriber/sensor_store.py \
            iot-bulut-mimarisi/subscriber/mqtt_subscriber.py \
            XGBoost-Hasat-Tahmin-Modeli/harvest_model.py \
            projeuyp/services.py \
            "Görüntü İşleme/src/demo_predict.py"
      - name: Validate GitHub Actions
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color

  tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            iot-bulut-mimarisi/requirements.txt
            projeuyp/requirements.txt
            XGBoost-Hasat-Tahmin-Modeli/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgomp1
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r iot-bulut-mimarisi/requirements.txt
          python -m pip install -r projeuyp/requirements.txt
          python -m pip install -r XGBoost-Hasat-Tahmin-Modeli/requirements.txt
      - name: Run required tests and coverage gate
        run: |
          mkdir -p reports
          pytest tests/unit tests/integration \
            --cov=simulator.sensor_core \
            --cov=subscriber.message_processor \
            --cov=subscriber.sensor_store \
            --cov=projeuyp.services \
            --cov=harvest_model \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --junitxml=reports/junit.xml \
            --cov-fail-under=70
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: reports/
          if-no-files-found: warn

  ci-success:
    name: CI Success
    if: always()
    needs:
      - lint
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
